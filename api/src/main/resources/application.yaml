spring:
  application:
    name: api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/price_stalker_test}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8080}

cors:
  allowed:
    origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}

jwt:
  secret: ${JWT_SECRET:N9f348j09f8jjfoi38hg4985jg98ufh8943fj7hf4uyf87as76g34f0837hybf83ufh087y3b4uyf}
  expiration: ${JWT_EXPIRATION:86400000}