spring:
  application:
    name: api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/price_stalker_test}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8080}

cors:
  allowed:
    origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}

jwt:
  # No fallback on purpose: startup MUST fail if JWT_SECRET is unset rather than silently sign
  # tokens with a repo-known key (anyone could then forge a token for any user). Set via deploy env.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# Web Push (E4). Public key is served to the SPA; the private key lives in email-service (the sender).
vapid:
  public-key: ${VAPID_PUBLIC_KEY:}