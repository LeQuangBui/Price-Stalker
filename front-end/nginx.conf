server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Defense-in-depth: the JWT lives in localStorage, so cap the blast radius of any XSS/
        # clickjacking. (A Content-Security-Policy is the bigger win but needs QA against the running
        # app — Google Fonts + retailer image CDNs + the push service worker — so it's tracked, not set here.)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}