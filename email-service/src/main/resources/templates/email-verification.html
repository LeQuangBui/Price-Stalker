<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;background:#e2e8f0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#e2e8f0;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="640" cellpadding="0" cellspacing="0" style="max-width:640px;background:#ffffff;border-radius:16px;overflow:hidden;">
                <tr>
                    <td th:replace="~{fragments/header :: header('Verify Your Email')}"></td>
                </tr>
                <tr>
                    <td style="padding:32px;color:#0f172a;font-family:Arial,sans-serif;font-size:16px;line-height:1.7;">
                        <p style="margin:0 0 16px 0;">
                            Hello <strong th:text="${user.username}">user</strong>,
                        </p>
                        <p style="margin:0 0 16px 0;">
                            Enter this code in Price Stalker to verify your email address.
                        </p>
                        <div style="margin:0 0 16px 0;padding:18px;border-radius:12px;background:#f8fafc;border:1px solid #cbd5e1;text-align:center;">
                            <p style="margin:0;font-family:'Courier New',monospace;font-size:30px;letter-spacing:6px;color:#0f172a;font-weight:700;" th:text="${verificationCode}">
                                123456
                            </p>
                        </div>
                        <p style="margin:0;color:#475569;">
                            This code expires in <span th:text="${expiresInMinutes}">15</span> minutes.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td th:replace="~{fragments/footer :: footer()}"></td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
