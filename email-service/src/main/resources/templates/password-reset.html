<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;background:#e2e8f0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#e2e8f0;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="640" cellpadding="0" cellspacing="0" style="max-width:640px;background:#ffffff;border-radius:16px;overflow:hidden;">
                <tr>
                    <td th:replace="~{fragments/header :: header('Password Reset Request')}"></td>
                </tr>
                <tr>
                    <td style="padding:32px;color:#0f172a;font-family:Arial,sans-serif;font-size:16px;line-height:1.7;">
                        <p style="margin:0 0 16px 0;">
                            Hello <strong th:text="${user.username}">user</strong>,
                        </p>
                        <p style="margin:0 0 16px 0;">
                            Use the button below to set a new password for your Price Stalker account.
                        </p>
                        <p style="margin:0 0 20px 0;">
                            <a th:href="${resetUrl}" style="display:inline-block;padding:12px 18px;border-radius:8px;background:#2563eb;color:#ffffff;text-decoration:none;font-weight:700;">
                                Reset password
                            </a>
                        </p>
                        <p style="margin:0 0 16px 0;color:#475569;">
                            This link expires in <span th:text="${expiresInMinutes}">30</span> minutes.
                        </p>
                        <p style="margin:0;color:#475569;">
                            If you did not request this, you can ignore this email.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td th:replace="~{fragments/footer :: footer()}"></td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
