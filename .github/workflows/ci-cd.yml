name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test-java:
    name: Test Java components
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrappers executable
        run: chmod +x price-stalker-core/mvnw api/mvnw email-service/mvnw cron-service/mvnw

      - name: Test shared core
        run: ./mvnw -B test
        working-directory: price-stalker-core

      - name: Install shared core
        run: ./mvnw -B install -DskipTests
        working-directory: price-stalker-core

      - name: Test API
        run: ./mvnw -B test
        working-directory: api

      - name: Test email service
        run: ./mvnw -B test
        working-directory: email-service

      - name: Test cron service
        run: ./mvnw -B test
        working-directory: cron-service

  test-front-end:
    name: Test frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: front-end

      - name: Run frontend unit tests
        run: npm test
        working-directory: front-end

      - name: Build frontend
        run: npm run build
        working-directory: front-end

  test-crawler:
    name: Test crawler
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: crawler
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install crawler dependencies
        run: python -m pip install -r crawler/requirements.txt

      - name: Run crawler tests
        run: python -m pytest crawler/tests -q

  docker-build-check:
    name: Validate Docker builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
            context: .
            build_args: ''
          - name: email-service
            dockerfile: Dockerfile.email-service
            context: .
            build_args: ''
          - name: cron-service
            dockerfile: Dockerfile.cron-service
            context: .
            build_args: ''
          - name: front-end
            dockerfile: front-end/Dockerfile
            context: .
            build_args: '--build-arg VITE_API_URL=http://localhost:8080/'
          - name: crawler
            dockerfile: crawler/Dockerfile
            context: .
            build_args: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          BUILD_ARGS: ${{ matrix.build_args }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$BUILD_ARGS" ]; then
            args=($BUILD_ARGS)
          fi
          docker build -f "$DOCKERFILE" "${args[@]}" -t "price-stalker-${{ matrix.name }}:ci" "$BUILD_CONTEXT"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs:
      - test-java
      - test-front-end
      - test-crawler
      - docker-build-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_PATH }}"
            git fetch --all --prune
            git checkout main
            git pull --ff-only origin main
            docker compose -f docker-compose.prod.yml --env-file .env.prod build
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
            docker image prune -f
            docker compose -f docker-compose.prod.yml --env-file .env.prod ps
